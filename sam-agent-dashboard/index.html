<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sam Agent - Government Contracting Intelligence</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0f172a;
            color: #e2e8f0;
            min-height: 100vh;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid #1e293b;
            margin-bottom: 30px;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 18px;
        }

        .logo h1 {
            font-size: 24px;
            font-weight: 700;
        }

        .logo span {
            color: #64748b;
            font-size: 14px;
            font-weight: 400;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #3b82f6, #8b5cf6);
            color: white;
        }

        .btn-primary:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #1e293b;
            color: #e2e8f0;
            border: 1px solid #334155;
        }

        .btn-secondary:hover {
            background: #334155;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #1e293b;
            border-radius: 12px;
            padding: 24px;
            border: 1px solid #334155;
        }

        .stat-card h3 {
            color: #64748b;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
        }

        .stat-card .value {
            font-size: 32px;
            font-weight: 700;
            color: #f1f5f9;
        }

        .stat-card .value.pursue { color: #22c55e; }
        .stat-card .value.review { color: #eab308; }
        .stat-card .value.watch { color: #64748b; }

        /* Main Content */
        .main-content {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 30px;
        }

        @media (max-width: 1024px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }

        /* Opportunities Section */
        .section {
            background: #1e293b;
            border-radius: 12px;
            border: 1px solid #334155;
            overflow: hidden;
        }

        .section-header {
            padding: 20px 24px;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-header h2 {
            font-size: 18px;
            font-weight: 600;
        }

        .filter-tabs {
            display: flex;
            gap: 8px;
        }

        .filter-tab {
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            background: transparent;
            color: #64748b;
            border: 1px solid transparent;
            transition: all 0.2s;
        }

        .filter-tab:hover, .filter-tab.active {
            background: #334155;
            color: #e2e8f0;
        }

        .filter-tab.active {
            border-color: #3b82f6;
            color: #3b82f6;
        }

        /* Opportunity Cards */
        .opportunities-list {
            max-height: 600px;
            overflow-y: auto;
        }

        .opportunity-card {
            padding: 20px 24px;
            border-bottom: 1px solid #334155;
            cursor: pointer;
            transition: background 0.2s;
        }

        .opportunity-card:hover {
            background: #334155;
        }

        .opportunity-card:last-child {
            border-bottom: none;
        }

        .opp-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 12px;
        }

        .opp-title {
            font-size: 15px;
            font-weight: 600;
            color: #f1f5f9;
            line-height: 1.4;
            flex: 1;
            margin-right: 12px;
        }

        .opp-score {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            white-space: nowrap;
        }

        .opp-score.pursue {
            background: rgba(34, 197, 94, 0.2);
            color: #22c55e;
        }

        .opp-score.review {
            background: rgba(234, 179, 8, 0.2);
            color: #eab308;
        }

        .opp-score.watch {
            background: rgba(100, 116, 139, 0.2);
            color: #94a3b8;
        }

        .opp-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            font-size: 13px;
            color: #64748b;
        }

        .opp-meta span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .opp-reasons {
            margin-top: 10px;
            font-size: 13px;
            color: #94a3b8;
        }

        /* Briefing Section */
        .briefing-content {
            padding: 24px;
        }

        .briefing-date {
            color: #64748b;
            font-size: 13px;
            margin-bottom: 16px;
        }

        .briefing-text {
            font-size: 14px;
            line-height: 1.7;
            color: #cbd5e1;
            white-space: pre-wrap;
        }

        .briefing-loading, .opportunities-loading {
            padding: 40px;
            text-align: center;
            color: #64748b;
        }

        .empty-state {
            padding: 60px 24px;
            text-align: center;
            color: #64748b;
        }

        .empty-state h3 {
            margin-bottom: 8px;
            color: #94a3b8;
        }

        /* Company Info */
        .company-info {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border-radius: 12px;
            padding: 20px 24px;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }

        .company-info h3 {
            font-size: 16px;
            margin-bottom: 12px;
            color: #f1f5f9;
        }

        .company-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 13px;
        }

        .company-details span {
            color: #64748b;
        }

        .company-details strong {
            color: #94a3b8;
            font-weight: 500;
        }

        /* Loading Spinner */
        .spinner {
            width: 24px;
            height: 24px;
            border: 3px solid #334155;
            border-top-color: #3b82f6;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 12px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #1e293b;
        }

        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }

        /* Status indicator */
        .api-status {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: #64748b;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #64748b;
        }

        .status-dot.online {
            background: #22c55e;
        }

        .status-dot.offline {
            background: #ef4444;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <div class="logo-icon">S</div>
                <div>
                    <h1>Sam Agent</h1>
                    <span>Government Contracting Intelligence</span>
                </div>
            </div>
            <div class="header-actions">
                <div class="api-status">
                    <div class="status-dot" id="statusDot"></div>
                    <span id="statusText">Connecting...</span>
                </div>
                <button class="btn btn-secondary" onclick="refreshData()">Refresh</button>
                <button class="btn btn-primary" onclick="fetchFresh()">Fetch from SAM.gov</button>
            </div>
        </header>

        <div class="company-info">
            <h3>Singh Automation LLC</h3>
            <div class="company-details">
                <span>CAGE: <strong>86VF7</strong></span>
                <span>UEI: <strong>GJ1DPYQ3X8K5</strong></span>
                <span>Primary NAICS: <strong>333249</strong></span>
                <span>Status: <strong>Small Business</strong></span>
            </div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Total Opportunities</h3>
                <div class="value" id="totalOpps">-</div>
            </div>
            <div class="stat-card">
                <h3>Pursue</h3>
                <div class="value pursue" id="pursueCount">-</div>
            </div>
            <div class="stat-card">
                <h3>Review</h3>
                <div class="value review" id="reviewCount">-</div>
            </div>
            <div class="stat-card">
                <h3>Watch</h3>
                <div class="value watch" id="watchCount">-</div>
            </div>
        </div>

        <div class="main-content">
            <div class="section">
                <div class="section-header">
                    <h2>Opportunities</h2>
                    <div class="filter-tabs">
                        <button class="filter-tab active" data-filter="all">All</button>
                        <button class="filter-tab" data-filter="pursue">Pursue</button>
                        <button class="filter-tab" data-filter="review">Review</button>
                        <button class="filter-tab" data-filter="watch">Watch</button>
                    </div>
                </div>
                <div class="opportunities-list" id="opportunitiesList">
                    <div class="opportunities-loading">
                        <div class="spinner"></div>
                        Loading opportunities...
                    </div>
                </div>
            </div>

            <div class="section">
                <div class="section-header">
                    <h2>Daily Briefing</h2>
                    <button class="btn btn-secondary" onclick="generateBriefing()">Generate</button>
                </div>
                <div class="briefing-content" id="briefingContent">
                    <div class="briefing-loading">
                        <div class="spinner"></div>
                        Loading briefing...
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // API Configuration
        const API_BASE = 'https://sam-agent-production-85f3.up.railway.app';

        let allOpportunities = [];
        let currentFilter = 'all';

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            checkHealth();
            loadOpportunities();
            loadBriefing();
            setupFilterTabs();
        });

        // Check API Health
        async function checkHealth() {
            try {
                const response = await fetch(`${API_BASE}/health`);
                const data = await response.json();

                if (data.status === 'healthy') {
                    document.getElementById('statusDot').classList.add('online');
                    document.getElementById('statusText').textContent = 'API Online';
                } else {
                    throw new Error('Unhealthy');
                }
            } catch (error) {
                document.getElementById('statusDot').classList.add('offline');
                document.getElementById('statusText').textContent = 'API Offline';
            }
        }

        // Load Opportunities
        async function loadOpportunities() {
            try {
                const response = await fetch(`${API_BASE}/opportunities?limit=100`);
                const data = await response.json();

                if (data.success) {
                    allOpportunities = data.data || [];
                    updateStats();
                    renderOpportunities();
                }
            } catch (error) {
                console.error('Error loading opportunities:', error);
                document.getElementById('opportunitiesList').innerHTML = `
                    <div class="empty-state">
                        <h3>Unable to load opportunities</h3>
                        <p>Check your connection and try again</p>
                    </div>
                `;
            }
        }

        // Fetch Fresh from SAM.gov
        async function fetchFresh() {
            document.getElementById('opportunitiesList').innerHTML = `
                <div class="opportunities-loading">
                    <div class="spinner"></div>
                    Fetching from SAM.gov...
                </div>
            `;

            try {
                const response = await fetch(`${API_BASE}/opportunities?fresh=true&limit=100`);
                const data = await response.json();

                if (data.success) {
                    allOpportunities = data.data || [];
                    updateStats();
                    renderOpportunities();
                }
            } catch (error) {
                console.error('Error fetching:', error);
                alert('Error fetching from SAM.gov');
                loadOpportunities();
            }
        }

        // Update Stats
        function updateStats() {
            const pursue = allOpportunities.filter(o => (o.score || 0) >= 50).length;
            const review = allOpportunities.filter(o => (o.score || 0) >= 25 && (o.score || 0) < 50).length;
            const watch = allOpportunities.filter(o => (o.score || 0) < 25).length;

            document.getElementById('totalOpps').textContent = allOpportunities.length;
            document.getElementById('pursueCount').textContent = pursue;
            document.getElementById('reviewCount').textContent = review;
            document.getElementById('watchCount').textContent = watch;
        }

        // Render Opportunities
        function renderOpportunities() {
            let filtered = allOpportunities;

            if (currentFilter === 'pursue') {
                filtered = allOpportunities.filter(o => (o.score || 0) >= 50);
            } else if (currentFilter === 'review') {
                filtered = allOpportunities.filter(o => (o.score || 0) >= 25 && (o.score || 0) < 50);
            } else if (currentFilter === 'watch') {
                filtered = allOpportunities.filter(o => (o.score || 0) < 25);
            }

            if (filtered.length === 0) {
                document.getElementById('opportunitiesList').innerHTML = `
                    <div class="empty-state">
                        <h3>No opportunities found</h3>
                        <p>Click "Fetch from SAM.gov" to search for new opportunities</p>
                    </div>
                `;
                return;
            }

            const html = filtered.map(opp => {
                const score = opp.score || 0;
                let scoreClass = 'watch';
                let scoreLabel = 'Watch';

                if (score >= 50) {
                    scoreClass = 'pursue';
                    scoreLabel = 'Pursue';
                } else if (score >= 25) {
                    scoreClass = 'review';
                    scoreLabel = 'Review';
                }

                const reasons = opp.reasons ? opp.reasons.join(' | ') : '';
                const deadline = opp.response_deadline ? new Date(opp.response_deadline).toLocaleDateString() : 'No deadline';

                return `
                    <div class="opportunity-card" onclick="window.open('${opp.url || '#'}', '_blank')">
                        <div class="opp-header">
                            <div class="opp-title">${opp.title || 'Untitled'}</div>
                            <div class="opp-score ${scoreClass}">${score} - ${scoreLabel}</div>
                        </div>
                        <div class="opp-meta">
                            <span>${opp.agency || 'Unknown Agency'}</span>
                            <span>NAICS: ${opp.naics_code || 'N/A'}</span>
                            <span>Due: ${deadline}</span>
                            ${opp.set_aside ? `<span>${opp.set_aside}</span>` : ''}
                        </div>
                        ${reasons ? `<div class="opp-reasons">${reasons}</div>` : ''}
                    </div>
                `;
            }).join('');

            document.getElementById('opportunitiesList').innerHTML = html;
        }

        // Setup Filter Tabs
        function setupFilterTabs() {
            document.querySelectorAll('.filter-tab').forEach(tab => {
                tab.addEventListener('click', () => {
                    document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
                    tab.classList.add('active');
                    currentFilter = tab.dataset.filter;
                    renderOpportunities();
                });
            });
        }

        // Load Briefing
        async function loadBriefing() {
            try {
                const response = await fetch(`${API_BASE}/briefing/today`);
                const data = await response.json();

                if (data.success && data.data) {
                    const briefing = data.data;
                    const content = briefing.content || {};

                    document.getElementById('briefingContent').innerHTML = `
                        <div class="briefing-date">${briefing.date || 'Today'}</div>
                        <div class="briefing-text">${content.briefing || content.summary || 'No briefing available. Click "Generate" to create one.'}</div>
                    `;
                }
            } catch (error) {
                console.error('Error loading briefing:', error);
                document.getElementById('briefingContent').innerHTML = `
                    <div class="empty-state">
                        <h3>No briefing available</h3>
                        <p>Click "Generate" to create a briefing</p>
                    </div>
                `;
            }
        }

        // Generate Briefing
        async function generateBriefing() {
            document.getElementById('briefingContent').innerHTML = `
                <div class="briefing-loading">
                    <div class="spinner"></div>
                    Generating briefing with AI...
                </div>
            `;

            await loadBriefing();
        }

        // Refresh Data
        function refreshData() {
            checkHealth();
            loadOpportunities();
            loadBriefing();
        }
    </script>
</body>
</html>
